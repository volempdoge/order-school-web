version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*", "react", "react-dom", "@types/react*"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
      radix:
        patterns: ["@radix-ui/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
